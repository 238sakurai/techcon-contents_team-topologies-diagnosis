<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="SRE向けTeam Topologies診断。10問のYes/Noで、あなたのチームの特性を診断します。">
    <meta name="theme-color" content="#0a0a12">
    <title>Team Topologies 診断 | SREあるある×チーム特性</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Team Topologies 診断</h1>
            <p class="subtitle">SREあるある×チーム特性診断</p>
        </header>

        <main id="app">
            <!-- Start Screen -->
            <div id="start-screen" class="screen active">
                <div class="intro">
                    <p>10問のYes/Noで、あなたのチームの特性を診断します。<br>所要時間：約1〜2分</p>
                    <button id="start-btn" class="btn primary" aria-label="診断を開始する">診断を開始する</button>
                </div>
            </div>

            <!-- Question Screen -->
            <div id="question-screen" class="screen">
                <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="10">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="question-container">
                    <p class="question-number">質問 <span id="current-q">1</span> / <span id="total-q">10</span></p>
                    <h2 id="question-text"></h2>
                    <div id="options" class="options" role="group" aria-label="回答選択"></div>
                </div>
            </div>

            <!-- Result Screen -->
            <div id="result-screen" class="screen">
                <h2>診断結果</h2>
                <div id="result-content"></div>
                <button id="restart-btn" class="btn secondary" aria-label="もう一度診断する">もう一度診断する</button>
            </div>
        </main>

        <footer>
            <p>© 2026 Team Topologies Diagnosis</p>
        </footer>
    </div>

    <script src="assets/questions.js?v=2"></script>
    <script src="assets/app.js?v=2"></script>
</body>
</html>
